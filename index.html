<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北大附小智能阅读推荐</title>
  <style>
    :root {
      --bg: #FFF8F0;
      --paper: #FFFFFF;
      --ink: #2D2520;
      --muted: #75695F;
      --primary: #FF6B35;
      --primary-dark: #D94E1F;
      --blue: #4ECDC4;
      --pink: #FF6B9D;
      --yellow: #FFD166;
      --line: #EFDCCA;
      --soft-orange: #FFF0E7;
      --soft-blue: #E9FAF8;
      --soft-pink: #FFF0F6;
      --shadow: 0 10px 24px rgba(120, 78, 45, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 248, 240, 0.96), rgba(255, 248, 240, 1)),
        repeating-linear-gradient(135deg, rgba(255, 209, 102, 0.15) 0 10px, transparent 10px 22px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 14px 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-top: env(safe-area-inset-top);
      margin-bottom: 14px;
    }

    .logo {
      display: grid;
      place-items: center;
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 18px rgba(255, 107, 53, 0.25);
      font-size: 1.35rem;
      font-weight: 900;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 3px;
      font-size: 1.26rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .step {
      min-height: 44px;
      border: 1px solid rgba(239, 220, 202, 0.95);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      color: var(--muted);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6px;
      font-size: 0.9rem;
      font-weight: 850;
    }

    .step.active {
      border-color: rgba(255, 107, 53, 0.34);
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 16px rgba(255, 107, 53, 0.2);
    }

    .step.done {
      border-color: rgba(78, 205, 196, 0.34);
      color: #177A73;
      background: var(--soft-blue);
    }

    .view {
      animation: fadeIn 0.24s ease;
    }

    .hidden {
      display: none !important;
    }

    .panel,
    .book-card,
    .note-block,
    .question-card,
    .feedback-card {
      border: 1px solid rgba(239, 220, 202, 0.95);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 17px;
    }

    .hello {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #463A33;
      font-weight: 850;
    }

    .hint {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 48px;
      border: 1.5px solid #E9D5C3;
      border-radius: var(--radius);
      outline: none;
      background: #FFFDFC;
      color: var(--ink);
      padding: 12px 13px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.12);
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-btn,
    .ghost-btn,
    .secondary-btn,
    .primary-btn {
      min-height: 46px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    .tag-btn {
      border: 1px solid rgba(255, 107, 53, 0.22);
      color: #8D3F1B;
      background: var(--soft-orange);
      padding: 8px 11px;
      font-size: 0.92rem;
    }

    .primary-btn,
    .secondary-btn,
    .ghost-btn {
      width: 100%;
      border: 0;
      padding: 11px 14px;
    }

    .primary-btn {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 10px 20px rgba(255, 107, 53, 0.24);
    }

    .secondary-btn {
      color: #0F756F;
      background: var(--soft-blue);
      border: 1px solid rgba(78, 205, 196, 0.36);
    }

    .ghost-btn {
      color: var(--primary-dark);
      background: #FFF5EE;
      border: 1px solid rgba(255, 107, 53, 0.24);
    }

    .tag-btn:active,
    .primary-btn:active,
    .secondary-btn:active,
    .ghost-btn:active {
      transform: scale(0.98);
    }

    .button-row {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .result-head {
      display: grid;
      gap: 11px;
      margin-bottom: 16px;
    }

    .greeting {
      margin-bottom: 0;
      font-size: 1.2rem;
      font-weight: 950;
      line-height: 1.35;
    }

    .child-response {
      margin: 0;
      border-left: 5px solid var(--primary);
      border-radius: var(--radius);
      background: #fff;
      padding: 13px 14px;
      box-shadow: 0 7px 18px rgba(120, 78, 45, 0.08);
      white-space: pre-wrap;
    }

    .note-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .note-block {
      padding: 13px;
      box-shadow: 0 7px 18px rgba(120, 78, 45, 0.08);
    }

    .note-block h3 {
      margin-bottom: 5px;
      font-size: 1rem;
      line-height: 1.3;
    }

    .note-block p {
      margin-bottom: 0;
      color: #4B4038;
      white-space: pre-wrap;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      font-size: 1.06rem;
      line-height: 1.3;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
    }

    .dot.blue {
      background: var(--blue);
    }

    .dot.pink {
      background: var(--pink);
    }

    .book-list {
      display: grid;
      gap: 11px;
    }

    .book-card {
      padding: 14px;
      box-shadow: 0 8px 20px rgba(120, 78, 45, 0.09);
    }

    .book-card.interest {
      border-left: 6px solid var(--primary);
      background: linear-gradient(90deg, var(--soft-orange), #fff 48%);
    }

    .book-card.bridge {
      border-left: 6px solid var(--blue);
      background: linear-gradient(90deg, var(--soft-blue), #fff 48%);
    }

    .book-card.classic {
      border-left: 6px solid var(--pink);
      background: linear-gradient(90deg, var(--soft-pink), #fff 48%);
    }

    .type-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #6D5547;
      padding: 4px 9px;
      font-size: 0.82rem;
      font-weight: 900;
    }

    .book-title {
      margin: 9px 0 3px;
      font-size: 1.08rem;
      line-height: 1.35;
      font-weight: 950;
    }

    .book-author {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 700;
    }

    .reason {
      margin-bottom: 10px;
      color: #4C423A;
      white-space: pre-wrap;
    }

    .location {
      margin-bottom: 12px;
      border: 1px dashed rgba(78, 205, 196, 0.55);
      border-radius: var(--radius);
      background: rgba(233, 250, 248, 0.82);
      color: #0F756F;
      padding: 9px 10px;
      font-weight: 850;
    }

    .empty-note {
      margin: 0;
      border: 1px dashed rgba(239, 220, 202, 0.95);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.75);
      color: var(--muted);
      padding: 12px;
    }

    .selected-book {
      margin-bottom: 14px;
      border-left: 5px solid var(--blue);
    }

    .question-list {
      display: grid;
      gap: 13px;
    }

    .question-card {
      padding: 14px;
      box-shadow: 0 8px 18px rgba(120, 78, 45, 0.08);
    }

    .question-title {
      margin-bottom: 10px;
      font-size: 1rem;
      line-height: 1.45;
      font-weight: 900;
    }

    .dimension {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 8px;
      border-radius: 999px;
      background: #FFF7DE;
      color: #7A5A0E;
      padding: 4px 9px;
      font-size: 0.82rem;
      font-weight: 900;
    }

    .feedback-card {
      padding: 16px;
      box-shadow: 0 8px 20px rgba(120, 78, 45, 0.1);
    }

    .score-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .level {
      margin-bottom: 0;
      font-size: 1.25rem;
      line-height: 1.3;
      font-weight: 950;
    }

    .score {
      flex: 0 0 auto;
      min-width: 68px;
      border-radius: var(--radius);
      color: #fff;
      background: var(--pink);
      padding: 8px 10px;
      text-align: center;
      font-weight: 950;
    }

    .stars {
      margin: 2px 0 10px;
      color: #E9A900;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    .progress {
      height: 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: #F5E5D6;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--yellow), var(--blue));
      border-radius: inherit;
      transition: width 0.35s ease;
    }

    .feedback-grid {
      display: grid;
      gap: 11px;
    }

    .feedback-item {
      border-radius: var(--radius);
      background: #FFFDFC;
      border: 1px solid rgba(239, 220, 202, 0.9);
      padding: 12px;
    }

    .feedback-item h3 {
      margin-bottom: 5px;
      font-size: 1rem;
    }

    .feedback-item p {
      margin-bottom: 0;
      color: #4B4038;
      white-space: pre-wrap;
    }

    .toast {
      display: none;
      position: fixed;
      z-index: 40;
      left: 14px;
      right: 14px;
      top: calc(12px + env(safe-area-inset-top));
      max-width: 532px;
      margin: 0 auto;
      border-radius: var(--radius);
      background: #FFF0E7;
      border: 1px solid rgba(255, 107, 53, 0.34);
      color: #843519;
      padding: 12px 13px;
      box-shadow: 0 12px 24px rgba(120, 78, 45, 0.14);
      font-weight: 850;
    }

    .toast.show {
      display: block;
      animation: fadeIn 0.16s ease;
    }

    .loading-mask {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(45, 37, 32, 0.28);
      padding: 20px;
    }

    .loading-box {
      width: min(100%, 300px);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 18px 42px rgba(45, 37, 32, 0.22);
      padding: 20px;
      text-align: center;
      font-weight: 900;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      border: 4px solid #FFE0CE;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 520px) {
      .app {
        padding-top: 22px;
      }

      .panel {
        padding: 20px;
      }

      .button-row.two {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">北</div>
      <div>
        <h1>北大附小智能阅读推荐</h1>
        <p class="subtitle">输入兴趣，找到下一本想读的书 📚</p>
      </div>
    </header>

    <div class="stepper" aria-label="阅读流程">
      <div id="stepOne" class="step active">1 找书</div>
      <div id="stepTwo" class="step">2 小问答</div>
      <div id="stepThree" class="step">3 反馈</div>
    </div>

    <section id="interestView" class="view panel" aria-labelledby="interestTitle">
      <h2 id="interestTitle" class="greeting">今天想读什么书呢？✨</h2>
      <p class="hello">可以写“我喜欢恐龙”“想看搞笑漫画”“不想看太厚的书”。</p>

      <form id="interestForm" class="form-grid">
        <label>
          姓名
          <input id="nameInput" type="text" autocomplete="name" placeholder="例如：小明" required>
        </label>

        <label>
          年级
          <select id="gradeInput" required>
            <option value="">请选择年级</option>
            <option value="一年级">一年级</option>
            <option value="二年级">二年级</option>
            <option value="三年级">三年级</option>
            <option value="四年级">四年级</option>
            <option value="五年级">五年级</option>
            <option value="六年级">六年级</option>
          </select>
        </label>

        <label>
          我喜欢什么书 / 想读什么
          <textarea id="queryInput" placeholder="例如：我喜欢恐龙，也想读有趣一点的书" required></textarea>
        </label>

        <label>
          阅读历史
          <textarea id="historyInput" placeholder="选填，例如：我读过《米小圈上学记》和《神奇校车》"></textarea>
        </label>

        <div class="quick-tags" aria-label="快速填写">
          <button class="tag-btn" type="button" data-tag="我想看搞笑漫画">搞笑漫画</button>
          <button class="tag-btn" type="button" data-tag="我喜欢恐龙和动物">恐龙动物</button>
          <button class="tag-btn" type="button" data-tag="我想看侦探和冒险故事">侦探冒险</button>
          <button class="tag-btn" type="button" data-tag="我不想看太厚的书">薄一点</button>
        </div>

        <button class="primary-btn" type="submit">帮我找书 ✨</button>
      </form>
    </section>

    <section id="recommendView" class="view hidden" aria-live="polite">
      <div class="result-head">
        <p id="recommendGreeting" class="greeting"></p>
        <p id="childResponse" class="child-response"></p>
      </div>

      <div id="noteGrid" class="note-grid"></div>

      <div class="section">
        <h2 class="section-title"><span class="dot"></span>兴趣入口书</h2>
        <div id="interestBooks" class="book-list"></div>
      </div>

      <div class="section">
        <h2 class="section-title"><span class="dot blue"></span>桥梁书</h2>
        <div id="bridgeBooks" class="book-list"></div>
      </div>

      <div class="section">
        <h2 class="section-title"><span class="dot pink"></span>经典 / 拓展书</h2>
        <div id="classicBooks" class="book-list"></div>
      </div>

      <div class="button-row two">
        <button id="backToInterestBtn" class="ghost-btn" type="button">返回修改兴趣</button>
        <button id="freshStartBtn" class="secondary-btn" type="button">重新开始 🎉</button>
      </div>
    </section>

    <section id="questionView" class="view hidden" aria-live="polite">
      <div class="panel selected-book">
        <p id="questionGreeting" class="greeting"></p>
        <p id="questionBookInfo" class="hello"></p>
      </div>

      <form id="answerForm" class="form-grid">
        <div id="questionList" class="question-list"></div>
        <button class="primary-btn" type="submit">我回答完了！🎯</button>
      </form>

      <div class="button-row">
        <button id="backToRecommendBtn" class="ghost-btn" type="button">返回书单</button>
      </div>
    </section>

    <section id="feedbackView" class="view hidden" aria-live="polite">
      <div class="feedback-card">
        <div class="score-line">
          <h2 id="feedbackLevel" class="level"></h2>
          <div id="feedbackScore" class="score"></div>
        </div>
        <div id="feedbackStars" class="stars" aria-hidden="true"></div>
        <div class="progress" aria-hidden="true">
          <div id="scoreBar" class="progress-bar"></div>
        </div>
        <div id="feedbackGrid" class="feedback-grid"></div>
      </div>

      <div class="button-row two">
        <button id="backToQuestionsBtn" class="ghost-btn" type="button">返回小问答</button>
        <button id="chooseAnotherBtn" class="secondary-btn" type="button">回到书单 📚</button>
      </div>
      <div class="button-row">
        <button id="finishResetBtn" class="primary-btn" type="button">重新找一本 ✨</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="alert"></div>
  <div id="loadingMask" class="loading-mask hidden" role="status" aria-live="polite">
    <div class="loading-box">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loadingText">正在联系阅读助手...</div>
    </div>
  </div>

  <script>
    const STATE_KEY = "pkuReadingH5StateV2";
    const REQUEST_TIMEOUT = 60000;
    const WORKFLOW_API_URL = "https://cqccmb7q97.coze.site/run";

    const DEFAULT_LIBRARY_CANDIDATES = [
      "《米小圈上学记》|北猫|文学/校园|一层儿童文学 A-03",
      "《父与子全集》|埃·奥·卜劳恩|漫画/幽默|一层绘本漫画 B-08",
      "《恐龙大陆》|黑川光广|绘本/恐龙|二层自然科普 C-02",
      "《神奇校车》|乔安娜·柯尔|科普/冒险|二层自然科普 C-10",
      "《晴天有时下猪》|矢玉四郎|文学/想象|一层桥梁阅读 D-06",
      "《查理九世》|雷欧幻像|侦探/冒险|一层桥梁阅读 D-12",
      "《窗边的小豆豆》|黑柳彻子|文学/成长|二层经典阅读 E-04",
      "《小王子》|圣埃克苏佩里|经典/哲思|二层经典阅读 E-09",
      "《森林报》|维·比安基|自然/科普|二层自然科普 C-15",
      "《中国神话故事》|袁珂 编著|传统文化/神话|二层经典阅读 F-01"
    ].join("\n");

    const BASE_PAYLOAD = {
      user_query: "",
      grade: "",
      reading_history: "",
      library_candidates: "",
      book_title: "",
      book_author: "",
      book_summary: "",
      book_category: "",
      questions_and_answers: ""
    };

    const GROUPS = [
      {
        key: "interest_books",
        targetId: "interestBooks",
        className: "interest",
        label: "兴趣入口书"
      },
      {
        key: "bridge_books",
        targetId: "bridgeBooks",
        className: "bridge",
        label: "桥梁书"
      },
      {
        key: "classic_books",
        targetId: "classicBooks",
        className: "classic",
        label: "经典 / 拓展书"
      }
    ];

    const views = {
      interest: document.querySelector("#interestView"),
      recommendations: document.querySelector("#recommendView"),
      questions: document.querySelector("#questionView"),
      evaluation: document.querySelector("#feedbackView")
    };

    const fields = {
      name: document.querySelector("#nameInput"),
      grade: document.querySelector("#gradeInput"),
      query: document.querySelector("#queryInput"),
      history: document.querySelector("#historyInput")
    };

    let appState = createEmptyState();
    let toastTimer = null;

    initialize();

    function initialize() {
      loadState();
      bindEvents();
      renderFromState();
    }

    function bindEvents() {
      document.querySelector("#interestForm").addEventListener("submit", handleInterestSubmit);
      document.querySelector("#answerForm").addEventListener("submit", handleAnswerSubmit);
      document.querySelector("#backToInterestBtn").addEventListener("click", () => goToStage("interest"));
      document.querySelector("#backToRecommendBtn").addEventListener("click", () => goToStage("recommendations"));
      document.querySelector("#backToQuestionsBtn").addEventListener("click", () => goToStage("questions"));
      document.querySelector("#chooseAnotherBtn").addEventListener("click", () => goToStage("recommendations"));
      document.querySelector("#freshStartBtn").addEventListener("click", resetAll);
      document.querySelector("#finishResetBtn").addEventListener("click", resetAll);

      document.querySelectorAll(".tag-btn").forEach((button) => {
        button.addEventListener("click", () => {
          fields.query.value = button.dataset.tag || "";
          saveDraftProfile();
          fields.query.focus();
        });
      });

      Object.values(fields).forEach((field) => {
        field.addEventListener("input", () => {
          saveDraftProfile();
        });
      });
    }

    async function handleInterestSubmit(event) {
      event.preventDefault();
      hideToast();

      const profile = readProfile();
      if (!profile.name || !profile.grade || !profile.user_query) {
        showToast("请先写好姓名、年级和想读什么书，我才能帮你找哦。");
        return;
      }

      appState = {
        ...createEmptyState(),
        stage: "interest",
        profile
      };
      persistState();

      try {
        const response = await postToApi({
          user_query: profile.user_query,
          grade: profile.grade,
          reading_history: profile.reading_history
        }, "正在为你翻书架...");
        const recommendation = normalizeRecommendation(parseRecommendationResponse(response));

        appState.stage = "recommendations";
        appState.recommendation = recommendation;
        appState.questions = [];
        appState.answers = [];
        appState.evaluation = null;
        appState.selectedBook = null;
        persistState();
        renderFromState();
      } catch (error) {
        showToast(getFriendlyError(error));
      }
    }

    async function handleReadFinished(book, group) {
      hideToast();
      appState.selectedBook = normalizeSelectedBook(book, group);
      appState.stage = "recommendations";
      appState.questions = [];
      appState.answers = [];
      appState.evaluation = null;
      persistState();

      try {
        const response = await postToApi({
          book_title: appState.selectedBook.title,
          book_author: appState.selectedBook.author,
          book_summary: appState.selectedBook.summary,
          book_category: appState.selectedBook.category,
          grade: appState.profile.grade
        }, "正在准备阅读小问题...");
        const questions = normalizeQuestions(parseReadingCheckResponse(response));

        appState.stage = "questions";
        appState.questions = questions;
        appState.answers = questions.map(() => "");
        persistState();
        renderFromState();
      } catch (error) {
        showToast(getFriendlyError(error));
      }
    }

    async function handleAnswerSubmit(event) {
      event.preventDefault();
      hideToast();
      collectAnswersFromForm();

      const questionsAndAnswers = appState.questions.map((question, index) => ({
        question: question.question,
        child_answer: appState.answers[index] || ""
      }));

      const hasEmptyAnswer = questionsAndAnswers.some((item) => !item.child_answer.trim());
      if (hasEmptyAnswer) {
        showToast("每个小问题都写一点答案，再交给我看吧。");
        return;
      }

      try {
        const response = await postToApi({
          book_title: appState.selectedBook.title,
          book_author: appState.selectedBook.author,
          book_summary: appState.selectedBook.summary,
          book_category: appState.selectedBook.category,
          grade: appState.profile.grade,
          questions_and_answers: JSON.stringify(questionsAndAnswers)
        }, "正在认真看看你的回答...");
        const evaluation = normalizeEvaluation(parseReadingCheckResponse(response));

        appState.stage = "evaluation";
        appState.evaluation = evaluation;
        persistState();
        renderFromState();
      } catch (error) {
        showToast(getFriendlyError(error));
      }
    }

    async function postToApi(overrides, loadingText) {
      const headers = {
        "Content-Type": "application/json"
      };

      const body = {
        ...BASE_PAYLOAD,
        library_candidates: DEFAULT_LIBRARY_CANDIDATES,
        ...overrides
      };

      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
      showLoading(loadingText);

      try {
        const response = await fetch(WORKFLOW_API_URL, {
          method: "POST",
          headers,
          body: JSON.stringify(body),
          signal: controller.signal
        });
        const text = await response.text();

        if (!response.ok) {
          throw new Error(getResponseErrorMessage(response.status));
        }

        if (!text.trim()) {
          return {};
        }

        try {
          return JSON.parse(text);
        } catch (error) {
          return text;
        }
      } finally {
        window.clearTimeout(timer);
        hideLoading();
      }
    }

    function parseRecommendationResponse(response) {
      const envelope = parseMaybeJson(response, "推荐结果");
      const firstPayload = pickFirstValue(envelope, ["result"]);
      const payload = firstPayload === undefined ? envelope : parseMaybeJson(firstPayload, "推荐结果");

      if (payload && payload.result !== undefined && !payload.recommendations) {
        return parseMaybeJson(payload.result, "推荐结果");
      }
      return payload;
    }

    function parseReadingCheckResponse(response) {
      const envelope = parseMaybeJson(response, "阅读检测结果");
      const firstPayload = pickFirstValue(envelope, ["reading_check_result", "result"]);
      const payload = firstPayload === undefined ? envelope : parseMaybeJson(firstPayload, "阅读检测结果");

      if (payload && payload.reading_check_result !== undefined) {
        return parseMaybeJson(payload.reading_check_result, "阅读检测结果");
      }
      return payload;
    }

    function normalizeRecommendation(raw) {
      const recommendations = raw.recommendations || {};
      const normalized = {
        child_response: textOf(raw.child_response),
        reading_path: textOf(raw.reading_path),
        parent_message: textOf(raw.parent_message),
        follow_up_question: textOf(raw.follow_up_question),
        recommendations: {
          interest_books: normalizeBooks(recommendations.interest_books),
          bridge_books: normalizeBooks(recommendations.bridge_books),
          classic_books: normalizeBooks(recommendations.classic_books)
        }
      };

      const totalBooks = GROUPS.reduce((count, group) => count + normalized.recommendations[group.key].length, 0);
      if (!totalBooks) {
        throw new Error("阅读助手暂时没有找到合适的书，请稍后再试一次。");
      }

      return normalized;
    }

    function normalizeBooks(list) {
      if (!Array.isArray(list)) {
        return [];
      }

      return list.map((book) => ({
        title: textOf(book.title || book.book_title),
        author: textOf(book.author || book.book_author),
        reason: textOf(book.reason_for_child || book.reason || book.recommend_reason || book.summary),
        location: textOf(book.location || book.library_location || book.position),
        value_type: textOf(book.value_type || book.book_category || book.category),
        summary: textOf(book.summary || book.book_summary || book.description || book.introduction || book.reason_for_child || book.reason),
        category: textOf(book.book_category || book.category || book.value_type)
      })).filter((book) => book.title);
    }

    function normalizeSelectedBook(book, group) {
      const summary = textOf(book.summary || book.reason);
      const category = textOf(book.category || book.value_type || group.label);
      return {
        ...book,
        groupKey: group.key,
        groupLabel: group.label,
        summary,
        category
      };
    }

    function normalizeQuestions(raw) {
      const list = Array.isArray(raw.questions) ? raw.questions : Array.isArray(raw) ? raw : [];
      const questions = list.slice(0, 3).map((item) => ({
        question: textOf(item.question),
        reference_answer: textOf(item.reference_answer),
        dimension: textOf(item.dimension)
      })).filter((item) => item.question);

      if (!questions.length) {
        throw new Error("阅读助手暂时没有准备好小问题，请稍后再试一次。");
      }

      return questions;
    }

    function normalizeEvaluation(raw) {
      const evaluation = {
        level: textOf(raw.level),
        score: Number.isFinite(Number(raw.score)) ? Number(raw.score) : null,
        summary: textOf(raw.summary),
        detail_feedback: textOf(raw.detail_feedback),
        encouragement: textOf(raw.encouragement),
        next_book_suggestion: textOf(raw.next_book_suggestion)
      };

      if (!evaluation.level && evaluation.score === null && !evaluation.summary && !evaluation.detail_feedback) {
        throw new Error("阅读助手暂时没有完成反馈，请稍后再试一次。");
      }

      return evaluation;
    }

    function renderFromState() {
      hydrateProfileForm();
      validateStage();
      renderProgress();
      Object.keys(views).forEach((key) => {
        views[key].classList.toggle("hidden", appState.stage !== key);
      });

      if (appState.stage === "recommendations") {
        renderRecommendations();
      }
      if (appState.stage === "questions") {
        renderQuestions();
      }
      if (appState.stage === "evaluation") {
        renderFeedback();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function validateStage() {
      if (appState.stage === "recommendations" && !appState.recommendation) {
        appState.stage = "interest";
      }
      if (appState.stage === "questions" && (!appState.selectedBook || !appState.questions.length)) {
        appState.stage = appState.recommendation ? "recommendations" : "interest";
      }
      if (appState.stage === "evaluation" && !appState.evaluation) {
        appState.stage = appState.questions.length ? "questions" : "interest";
      }
    }

    function renderProgress() {
      const stepIndex = appState.stage === "questions" ? 2 : appState.stage === "evaluation" ? 3 : 1;
      [
        document.querySelector("#stepOne"),
        document.querySelector("#stepTwo"),
        document.querySelector("#stepThree")
      ].forEach((step, index) => {
        const current = index + 1;
        step.classList.toggle("active", current === stepIndex);
        step.classList.toggle("done", current < stepIndex);
      });
    }

    function renderRecommendations() {
      const profile = appState.profile;
      const result = appState.recommendation;
      document.querySelector("#recommendGreeting").textContent = `${profile.name || "小读者"}，这是给你的阅读路线 🌟`;
      setOptionalText("#childResponse", result.child_response);
      renderNotes(result);

      GROUPS.forEach((group) => {
        const target = document.querySelector(`#${group.targetId}`);
        const list = result.recommendations[group.key] || [];
        target.innerHTML = "";

        if (!list.length) {
          const empty = document.createElement("p");
          empty.className = "empty-note";
          empty.textContent = "这一层暂时没有合适的书，可以先看看其他层。";
          target.appendChild(empty);
          return;
        }

        list.forEach((book) => {
          target.appendChild(createBookCard(book, group));
        });
      });
    }

    function renderNotes(result) {
      const noteGrid = document.querySelector("#noteGrid");
      noteGrid.innerHTML = "";

      [
        ["阅读路径", result.reading_path],
        ["给家长的建议", result.parent_message],
        ["可以继续聊", result.follow_up_question]
      ].forEach(([title, value]) => {
        if (!value) {
          return;
        }

        const block = document.createElement("article");
        block.className = "note-block";
        const heading = document.createElement("h3");
        heading.textContent = title;
        const paragraph = document.createElement("p");
        paragraph.textContent = value;
        block.append(heading, paragraph);
        noteGrid.appendChild(block);
      });
    }

    function createBookCard(book, group) {
      const card = document.createElement("article");
      card.className = `book-card ${group.className}`;

      const type = document.createElement("span");
      type.className = "type-pill";
      type.textContent = book.value_type || group.label;

      const title = document.createElement("h3");
      title.className = "book-title";
      title.textContent = `《${book.title}》`;

      const author = document.createElement("p");
      author.className = "book-author";
      author.textContent = book.author ? `作者：${book.author}` : "作者：暂未提供";

      const reason = document.createElement("p");
      reason.className = "reason";
      reason.textContent = book.reason || "这本书很适合从兴趣出发慢慢读。";

      const location = document.createElement("div");
      location.className = "location";
      location.textContent = book.location ? `📍 馆藏位置：${book.location}` : "📍 馆藏位置：请到图书馆服务台咨询";

      const readButton = document.createElement("button");
      readButton.className = "primary-btn";
      readButton.type = "button";
      readButton.textContent = "我已读完📖";
      readButton.addEventListener("click", () => handleReadFinished(book, group));

      card.append(type, title, author, reason, location, readButton);
      return card;
    }

    function renderQuestions() {
      const book = appState.selectedBook;
      document.querySelector("#questionGreeting").textContent = `读完《${book.title}》啦？🎯`;
      document.querySelector("#questionBookInfo").textContent = `${book.groupLabel} · ${book.author || "作者未返回"} · ${appState.profile.grade}`;

      const target = document.querySelector("#questionList");
      target.innerHTML = "";

      appState.questions.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "question-card";

        if (item.dimension) {
          const dimension = document.createElement("span");
          dimension.className = "dimension";
          dimension.textContent = item.dimension;
          card.appendChild(dimension);
        }

        const title = document.createElement("p");
        title.className = "question-title";
        title.textContent = `${index + 1}. ${item.question}`;

        const label = document.createElement("label");
        label.textContent = "我的回答";

        const textarea = document.createElement("textarea");
        textarea.value = appState.answers[index] || "";
        textarea.placeholder = "把你记得的内容写在这里";
        textarea.addEventListener("input", () => {
          appState.answers[index] = textarea.value;
          persistState();
        });

        label.appendChild(textarea);
        card.append(title, label);
        target.appendChild(card);
      });
    }

    function renderFeedback() {
      const evaluation = appState.evaluation;
      const score = evaluation.score === null ? null : clamp(evaluation.score, 0, 100);
      const levelText = evaluation.level || "阅读反馈";

      document.querySelector("#feedbackLevel").textContent = `${levelText} ✨`;
      document.querySelector("#feedbackScore").textContent = score === null ? "分数 --" : `${score} 分`;
      document.querySelector("#feedbackStars").textContent = renderStars(score);
      document.querySelector("#scoreBar").style.width = score === null ? "0%" : `${score}%`;

      const grid = document.querySelector("#feedbackGrid");
      grid.innerHTML = "";

      [
        ["整体评价", evaluation.summary],
        ["详细反馈", evaluation.detail_feedback],
        ["鼓励语", evaluation.encouragement],
        ["下一本推荐", evaluation.next_book_suggestion]
      ].forEach(([title, value]) => {
        if (!value) {
          return;
        }
        const item = document.createElement("article");
        item.className = "feedback-item";
        const heading = document.createElement("h3");
        heading.textContent = title;
        const paragraph = document.createElement("p");
        paragraph.textContent = value;
        item.append(heading, paragraph);
        grid.appendChild(item);
      });
    }

    function renderStars(score) {
      if (score === null) {
        return "☆☆☆☆☆";
      }
      const filled = clamp(Math.round(score / 20), 0, 5);
      return "★".repeat(filled) + "☆".repeat(5 - filled);
    }

    function goToStage(stage) {
      if (stage === "interest") {
        appState.stage = "interest";
      } else if (stage === "recommendations" && appState.recommendation) {
        appState.stage = "recommendations";
      } else if (stage === "questions" && appState.questions.length) {
        appState.stage = "questions";
      }
      persistState();
      renderFromState();
    }

    function resetAll() {
      appState = createEmptyState();
      persistState();
      hydrateProfileForm();
      renderFromState();
    }

    function readProfile() {
      return {
        name: fields.name.value.trim(),
        grade: fields.grade.value,
        user_query: fields.query.value.trim(),
        reading_history: fields.history.value.trim()
      };
    }

    function saveDraftProfile() {
      if (appState.stage !== "interest") {
        return;
      }
      appState.profile = readProfile();
      persistState();
    }

    function hydrateProfileForm() {
      const profile = appState.profile || {};
      fields.name.value = profile.name || "";
      fields.grade.value = profile.grade || "";
      fields.query.value = profile.user_query || "";
      fields.history.value = profile.reading_history || "";
    }

    function collectAnswersFromForm() {
      document.querySelectorAll("#questionList textarea").forEach((textarea, index) => {
        appState.answers[index] = textarea.value;
      });
      persistState();
    }

    function loadState() {
      const saved = readLocalJson(STATE_KEY, null);
      if (saved && typeof saved === "object") {
        appState = {
          ...createEmptyState(),
          ...saved,
          profile: {
            ...createEmptyState().profile,
            ...(saved.profile || {})
          },
          questions: Array.isArray(saved.questions) ? saved.questions : [],
          answers: Array.isArray(saved.answers) ? saved.answers : []
        };
      }
    }

    function persistState() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify({
          ...appState,
          updated_at: new Date().toISOString()
        }));
      } catch (error) {
        console.warn("Progress was not saved.", error);
      }
    }

    function readLocalJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        console.warn(`${key} could not be parsed.`, error);
        return fallback;
      }
    }

    function createEmptyState() {
      return {
        stage: "interest",
        profile: {
          name: "",
          grade: "",
          user_query: "",
          reading_history: ""
        },
        recommendation: null,
        selectedBook: null,
        questions: [],
        answers: [],
        evaluation: null
      };
    }

    function parseMaybeJson(value, label) {
      if (value === null || value === undefined || value === "") {
        return {};
      }
      if (typeof value === "object") {
        return value;
      }
      if (typeof value !== "string") {
        return value;
      }

      let text = value.trim();
      if (!text) {
        return {};
      }

      text = text
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/```$/i, "")
        .trim();

      try {
        return JSON.parse(text);
      } catch (error) {
        const objectStart = text.indexOf("{");
        const objectEnd = text.lastIndexOf("}");
        if (objectStart >= 0 && objectEnd > objectStart) {
          try {
            return JSON.parse(text.slice(objectStart, objectEnd + 1));
          } catch (nestedError) {
            // Try array extraction next.
          }
        }

        const arrayStart = text.indexOf("[");
        const arrayEnd = text.lastIndexOf("]");
        if (arrayStart >= 0 && arrayEnd > arrayStart) {
          try {
            return JSON.parse(text.slice(arrayStart, arrayEnd + 1));
          } catch (nestedError) {
            // Fall through to a friendly error.
          }
        }

        throw new Error("阅读助手返回的内容暂时无法识别，请稍后再试一次。");
      }
    }

    function pickFirstValue(source, keys) {
      if (!source || typeof source !== "object") {
        return undefined;
      }
      for (const key of keys) {
        if (source[key] !== undefined) {
          return source[key];
        }
        if (source.data && source.data[key] !== undefined) {
          return source.data[key];
        }
        if (source.output && source.output[key] !== undefined) {
          return source.output[key];
        }
      }
      return undefined;
    }

    function textOf(value) {
      if (value === null || value === undefined) {
        return "";
      }
      if (typeof value === "string") {
        return value.trim();
      }
      if (typeof value === "number" || typeof value === "boolean") {
        return String(value);
      }
      return "";
    }

    function setOptionalText(selector, value) {
      const element = document.querySelector(selector);
      element.textContent = value || "";
      element.classList.toggle("hidden", !value);
    }

    function showLoading(message) {
      document.querySelector("#loadingText").textContent = message || "正在联系阅读助手...";
      document.querySelector("#loadingMask").classList.remove("hidden");
    }

    function hideLoading() {
      document.querySelector("#loadingMask").classList.add("hidden");
    }

    function showToast(message) {
      const toast = document.querySelector("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(hideToast, 7200);
    }

    function hideToast() {
      const toast = document.querySelector("#toast");
      toast.classList.remove("show");
      toast.textContent = "";
      window.clearTimeout(toastTimer);
    }

    function getFriendlyError(error) {
      if (error && error.name === "AbortError") {
        return "阅读助手等待太久了，可以稍后再试一次。";
      }
      const message = error && error.message ? error.message : "";
      if (!message || /failed to fetch|networkerror|load failed/i.test(message)) {
        return "阅读助手暂时没有连上，请老师或图书馆老师先检查服务是否已经开启。";
      }
      return message;
    }

    function getResponseErrorMessage(status) {
      if (status === 401 || status === 403) {
        return "阅读助手还没有准备好，请老师或图书馆老师先开启服务。";
      }
      if (status >= 500) {
        return "阅读助手现在有点忙，请稍后再试一次。";
      }
      return "阅读助手暂时没有回应，请稍后再试一次。";
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }
  </script>
